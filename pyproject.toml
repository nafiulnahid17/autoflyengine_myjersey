[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "my-jersey-autofly-engine"
version = "0.1.0"
description = "Lightweight one-click orchestration service for the Artboard AI engine."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
autofly-engine = "autofly_engine.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autofly_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

